syntax = "proto3";

package calculator.v1;

option go_package = "github.com/ilx/grpc-course/proto/calculator/v1;calculatorv1";

message PrimeRequest {
  int32 a = 1;
}

message PrimeResponse {
  int32 result = 1;
}

message SumRequest {
  int32 a = 1;
  int32 b = 2;
}

message SumResponse {
  int32 result = 1;
}

message AvgRequest {
  float a = 1;
}

message AvgResponse {
  float result = 1;
}

message MaxRequest {
  int32 num = 1;
}

message MaxResponse {
  int32 result = 1;
}

service CalculatorService {
  rpc Prime(PrimeRequest) returns (stream PrimeResponse);
  rpc Sum(SumRequest) returns (SumResponse);
  rpc Avg(stream AvgRequest) returns (AvgResponse);
  rpc Max(stream MaxRequest) returns (stream MaxResponse);
}
